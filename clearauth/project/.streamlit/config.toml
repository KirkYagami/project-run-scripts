[theme]
base = "light"
primaryColor = "#0f766e"
backgroundColor = "#f6faf9"
secondaryBackgroundColor = "#e7f1ef"
textColor = "#10241f"
borderColor = "#d3e3df"
dataframeHeaderBackgroundColor = "#e2eeeb"
showWidgetBorder = true
baseRadius = "medium"
buttonRadius = "medium"
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
headingFontWeights = [700, 650, 600, 600, 600, 600]
metricValueFontSize = "1.5rem"
redColor = "#b91c1c"
orangeColor = "#b45309"
yellowColor = "#a16207"
greenColor = "#15803d"
blueColor = "#0369a1"
violetColor = "#6d28d9"

[theme.sidebar]
backgroundColor = "#e4f0ed"
secondaryBackgroundColor = "#d6e8e3"
textColor = "#10241f"
borderColor = "#c7dbd5"
primaryColor = "#115e59"

[server]
port = 8080
address = "0.0.0.0"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
